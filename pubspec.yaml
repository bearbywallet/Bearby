name: bearby
description: "Bearby wallet IOS, Android, Mac, Linux, Windows"
version: 3.8.32+924

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  rust_lib_zilpay:
    path: rust_builder
  flutter_rust_bridge: ^2.12.0
  path_provider: ^2.0.11
  provider: ^6.1.2
  flutter_svg: ^2.0.10+1
  local_auth: ^3.0.0
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  permission_handler: ^13.0.1
  url_launcher: ^6.3.2
  mobile_scanner: ^7.0.1
  share_plus: ^13.1.0
  flutter_inappwebview: ^6.1.5
  file_picker: ^12.0.0-beta.4
  app_links: ^7.0.0
  go_router: ^17.2.1
  intl: ^0.20.2
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  integration_test:
    sdk: flutter
  build_runner: ^2.15.0
  freezed: ^3.2.5

flutter:
  generate: true
  assets:
    - assets/icons/
    - assets/imgs/
    - assets/chains/
    - assets/.zilpay_legacy_inject.js
    - assets/.evm_inject.js
    - assets/.tron_inject.js
  fonts:
    - family: SFRounded
      fonts:
        - asset: assets/fonts/Regular.ttf    
          weight: 400                        
        - asset: assets/fonts/Bold.ttf       
          weight: 700                        
        - asset: assets/fonts/Semibold.ttf   
          weight: 600                        
        - asset: assets/fonts/Ultralight.ttf
          weight: 300
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf
          weight: 400

flutter_launcher_icons:
  android: true
  image_path: "assets/icon_light.png"
  adaptive_icon_background: "#E8176A"
  adaptive_icon_foreground: "assets/icon_light.png"
  min_sdk_android: 21
